platforms:
  feishu:
    enabled: true
    app_id: ${FEISHU_APP_ID}
    app_secret: ${FEISHU_APP_SECRET}
    domain: feishu
    connection_mode: websocket
    card_footer:
      enabled: true
      title: Hermes
      timezone: Asia/Shanghai
      storage_dir: ~/.local/share/openclaw-hermes-feishu-card
      legacy_task_dir: /tmp/openclaw-tasks
      balance_cache_path: ~/.openclaw/data/balance-cache.json
      update_interval_ms: 800
      panels:
        reasoning: true
        tools: true
        progress: true
        resources: true
        footer: true
      footer:
        status: true
        elapsed: true
        first_token: true
        model: true
        tokens: true
        cache: true
        context: true
        cost: true
        totals: true
        today_tokens: true
        month_tokens: true
        background_tasks: true
        balance: true
      pricing:
        - pattern: openrouter/qwen-*
          currency: USD
          input_per_million: 0.20
          output_per_million: 0.80
          cache_read_per_million: 0.02
          cache_write_per_million: 0.20
