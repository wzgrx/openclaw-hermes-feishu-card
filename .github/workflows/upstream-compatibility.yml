name: Upstream compatibility

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openclaw-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with:
          version: 11.18.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test against current npm releases
        run: pnpm update --latest openclaw @larksuite/openclaw-lark @larksuiteoapi/node-sdk zod
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm compat:openclaw

  openclaw-beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with:
          version: 11.18.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test plugin API against the current OpenClaw beta
        run: pnpm add --save-dev openclaw@beta
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm compat:openclaw:beta

  hermes-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install '.[hermes,dev]'
      - name: Check out Hermes main
        run: git clone --depth 1 https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-agent"
      - name: Test adapter against Hermes main
        env:
          PYTHONPATH: ${{ runner.temp }}/hermes-agent:${{ github.workspace }}
        run: |
          python -c "import gateway; assert '/hermes-agent/' in gateway.__file__; print(gateway.__file__)"
          python -m pytest tests_py/test_hermes_runtime.py -q
