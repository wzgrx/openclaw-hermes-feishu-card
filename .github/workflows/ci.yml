name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 11.18.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm run doctor
      - run: pnpm pack --pack-destination artifacts
      - uses: actions/upload-artifact@v6
        with:
          name: npm-package
          path: artifacts/*.tgz

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install '.[hermes,dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy hermes_feishu_card_footer
      - run: pytest
      - run: python -m build
      - uses: actions/upload-artifact@v6
        if: matrix.python == '3.12'
        with:
          name: python-package
          path: dist/*
